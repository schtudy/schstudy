<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슼터디 — 고등학생 스터디 매칭 플랫폼</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --paper:#F5EEE3; --card:#FFFFFF; --line:#D9C9B3; --bark:#8C6F52;
  --deep:#6B5A41; --ink:#4A3B2A; --faint:#A6906F; --sand:#EDE1CF;
  --ok-bg:#E7EFDC; --ok-fg:#3F5B22; --wait-bg:#F7E9D0; --wait-fg:#7A5512;
  --no-bg:#F2E2DE; --no-fg:#8A4436;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard',-apple-system,sans-serif;background:#E4D7C3;color:var(--ink);
  display:flex;justify-content:center;padding:20px 10px;min-height:100vh}
#app{width:100%;max-width:400px;background:var(--paper);border-radius:26px;
  border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;
  min-height:780px;position:relative}
.screen{display:flex;flex-direction:column;flex:1;padding:18px 16px}
.screen.hasnav{padding-bottom:76px}
h1{font-size:21px;font-weight:600;line-height:1.35}
h2{font-size:16px;font-weight:600;margin-bottom:9px}
p{font-size:13px;color:var(--deep);line-height:1.65}
.sub{font-size:12px;color:var(--faint);line-height:1.6}
.top{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.back{background:none;border:none;font-size:19px;color:var(--bark);cursor:pointer;line-height:1}
.title{font-size:16px;font-weight:600}
button{font-family:inherit;cursor:pointer}
.btn{width:100%;padding:13px;border:none;border-radius:12px;background:var(--bark);
  color:var(--paper);font-size:14.5px;font-weight:500}
.btn:disabled{background:#CFC0AC;cursor:not-allowed}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--deep)}
.btn.kakao{background:#FEE500;color:#3A2A16}
.btn.danger{background:transparent;border:1px solid var(--line);color:#8A4436}
.btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:9px}
.field{margin-bottom:13px}
label{display:block;font-size:12.5px;color:var(--deep);margin-bottom:6px;font-weight:500}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--card);font-family:inherit;font-size:13.5px;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--bark);outline-offset:-1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:13px;margin-bottom:10px}
.card.tap{cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.name{font-size:14.5px;font-weight:600}
.meta{font-size:12px;color:var(--bark);margin-top:5px;line-height:1.6}
.pill{font-size:11px;padding:3px 9px;border-radius:20px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-bg);color:var(--ok-fg)}
.pill.wait{background:var(--wait-bg);color:var(--wait-fg)}
.pill.no{background:var(--no-bg);color:var(--no-fg)}
.pill.tag{background:var(--sand);color:var(--deep)}
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}
.chip{font-size:12px;padding:6px 12px;border-radius:20px;background:var(--card);
  border:1px solid var(--line);color:var(--deep);cursor:pointer}
.chip.on{background:var(--bark);color:var(--paper);border-color:var(--bark)}
.tabs{display:flex;gap:4px;background:var(--sand);border-radius:11px;padding:3px;margin-bottom:13px}
.tab{flex:1;border:none;padding:9px;font-size:13px;border-radius:9px;background:transparent;color:var(--deep)}
.tab.on{background:var(--bark);color:var(--paper)}
.agree{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.agree:last-child{border-bottom:none}
.agree input{width:18px;height:18px;flex:none;margin-top:2px;accent-color:var(--bark)}
.agree .t{font-size:13.5px;font-weight:500}
.agree .d{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.55}
.note{background:var(--sand);border-radius:11px;padding:12px;font-size:12px;
  color:var(--deep);line-height:1.7}
.err{font-size:12px;color:#8A4436;margin-top:6px}
.dl{font-size:12.5px;line-height:1.95}
.dl b{font-weight:500;color:var(--deep);display:inline-block;width:80px}
.scroll{flex:1;overflow-y:auto}
.empty{text-align:center;padding:48px 16px}
.empty .ic{font-size:28px;color:var(--faint);margin-bottom:10px}
.empty .h{font-size:14.5px;font-weight:600;margin-bottom:6px}
.setrow{display:flex;justify-content:space-between;align-items:center;padding:14px 0;
  border-bottom:1px solid var(--line);gap:12px;cursor:pointer}
.setrow .t{font-size:13.5px;font-weight:500}
.setrow .d{font-size:11.5px;color:var(--faint);margin-top:3px;line-height:1.55}
.setrow input[type=checkbox]{width:20px;height:20px;flex:none;accent-color:var(--bark)}
.link{background:none;border:none;color:var(--bark);font-size:12.5px;text-decoration:underline}
.alert{display:flex;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}
.alert .dot{width:7px;height:7px;border-radius:50%;background:var(--bark);flex:none;margin-top:6px}
.alert .dot.read{background:var(--line)}
.alert .b{font-size:13px;line-height:1.6}
.alert .tm{font-size:11.5px;color:var(--faint);margin-top:4px}
.msg{max-width:78%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.55;margin-bottom:8px}
.msg.them{background:var(--card);border:1px solid var(--line);border-bottom-left-radius:4px}
.msg.me{background:var(--bark);color:var(--paper);margin-left:auto;border-bottom-right-radius:4px}
.msg .who{font-size:11px;opacity:.75;margin-bottom:3px}
.sys{text-align:center;font-size:11.5px;color:var(--faint);background:var(--sand);
  padding:9px 12px;border-radius:10px;margin-bottom:11px;line-height:1.6}
.nav{position:absolute;bottom:0;left:0;right:0;display:flex;background:var(--card);
  border-top:1px solid var(--line)}
.nav button{flex:1;border:none;background:none;padding:11px 0 15px;font-size:11.5px;color:var(--faint)}
.nav button.on{color:var(--bark);font-weight:600}
.badge{background:var(--bark);color:var(--paper);font-size:10px;padding:1px 6px;
  border-radius:10px;margin-left:3px}
hr{border:none;border-top:1px solid var(--line);margin:16px 0}
.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);
  color:var(--paper);padding:12px 14px;border-radius:12px;font-size:12.5px;line-height:1.6;
  opacity:0;transition:opacity .25s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.modal-ov{position:absolute;inset:0;background:rgba(74,59,42,.45);display:none;
  align-items:center;justify-content:center;padding:20px;z-index:20;border-radius:26px}
.modal-ov.on{display:flex}
.modal-box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:300px}
.modal-box p{font-size:13.5px;color:var(--ink);white-space:pre-line}
.modal-box .acts{display:flex;gap:8px;margin-top:16px}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:30px}
.spin{width:26px;height:26px;border:2.5px solid var(--line);border-top-color:var(--bark);
  border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.banner{background:var(--wait-bg);color:var(--wait-fg);border-radius:11px;padding:11px 12px;
  font-size:12px;line-height:1.65;margin-bottom:12px}
.banner .link{color:var(--wait-fg)}
</style>
</head>
<body>
<div id="app"><div class="screen"><div class="splash"><div class="spin"></div><p class="sub">불러오는 중</p></div></div></div>
<div class="toast" id="toast"></div>
<div class="modal-ov" id="modalOv"><div class="modal-box" id="modalBox"></div></div>

/* 학교 이메일만 받고 싶으면 도메인을 적으세요. 예: 'sen.hs.kr' (빈 값이면 제한 없음) */

<!-- 2. Firebase SDK 로드 -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut,
         onAuthStateChanged, sendPasswordResetEmail, sendEmailVerification,
         updatePassword, deleteUser, reload }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc,
         deleteDoc, onSnapshot, query, where, orderBy, limit, arrayUnion, arrayRemove, writeBatch }
  from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

try{
  const app = initializeApp(window.firebaseConfig);
  window.FB = {
    auth:getAuth(app), db:getFirestore(app),
    createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged,
    sendPasswordResetEmail, sendEmailVerification, updatePassword, deleteUser, reload,
    collection, doc, getDoc, getDocs, setDoc, addDoc, updateDoc, deleteDoc,
    onSnapshot, query, where, orderBy, limit, arrayUnion, arrayRemove, writeBatch
  };
  window.dispatchEvent(new Event('fb-ready'));
}catch(e){
  console.error(e);
  window.dispatchEvent(new CustomEvent('fb-fail',{detail:e}));
}
</script>

<!-- 3. 앱 -->
<script>
/* ---------- 상태 ---------- */
var FB=null, db=null, auth=null;
var ME=null, MEPUB=null, MEPRIV=null, UID=null;
var USERS={}, STUDIES=[], APPS_MINE=[], APPS_HOST=[], NOTIS=[], MSGS={};
var subs=[], msgSubs={}, signingUp=false, gotPub=false;
var view={name:'splash'}, draft={};
var LIVE={home:1,detail:1,manage:1,chats:1,chat:1,alerts:1,settings:1};

/* ---------- 접근자 ---------- */
function me(){return ME;}
function user(id){return USERS[id]||{id:id,nick:'알 수 없음',grade:'',notif:{}};}
function study(id){return STUDIES.filter(function(s){return s.id===id})[0];}
function appsFor(sid){return APPS_HOST.filter(function(a){return a.study===sid});}
function msgsOf(sid){return MSGS[sid]||[];}
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

/* ---------- 유틸 ---------- */
function ago(t){
  var d=Date.now()-t, m=Math.floor(d/60000);
  if(m<1) return '방금';
  if(m<60) return m+'분 전';
  var h=Math.floor(m/60); if(h<24) return h+'시간 전';
  return Math.floor(h/24)+'일 전';
}
function dleft(ds){return Math.ceil((new Date(ds+'T23:59:59')-Date.now())/86400000);}
function toast(t){
  var el=document.getElementById('toast');
  el.innerHTML=esc(t).replace(/\n/g,'<br>');
  el.classList.add('on');
  clearTimeout(el._t);
  el._t=setTimeout(function(){el.classList.remove('on')},3200);
}
function go(name,arg){view={name:name,arg:arg};render();}
var ERRS={
  'auth/email-already-in-use':'이미 가입된 이메일이에요.',
  'auth/invalid-email':'이메일 형식을 확인해 주세요.',
  'auth/weak-password':'비밀번호는 6자 이상이어야 해요.',
  'auth/user-not-found':'가입되지 않은 이메일이에요.',
  'auth/wrong-password':'비밀번호가 올바르지 않아요.',
  'auth/invalid-credential':'이메일 또는 비밀번호가 올바르지 않아요.',
  'auth/too-many-requests':'시도가 너무 많아요. 잠시 뒤에 다시 해주세요.',
  'auth/network-request-failed':'네트워크 연결을 확인해 주세요.',
  'auth/requires-recent-login':'보안을 위해 로그아웃 후 다시 로그인한 다음 시도해 주세요.',
  'permission-denied':'권한이 없어요. Firestore 보안 규칙을 확인해 주세요.',
  'unavailable':'서버에 연결하지 못했어요. 네트워크를 확인해 주세요.'
};
function errMsg(e){var c=(e&&e.code)||'';return ERRS[c]||c||'알 수 없는 오류';}
function fail(e){console.error(e);toast(errMsg(e));}
function setErr(id,msg){var el=document.getElementById(id);if(el)el.innerHTML='<div class="err">'+esc(msg)+'</div>';}
function busy(btn,on,label){
  if(!btn)return;
  btn.disabled=on;
  if(on){btn._l=btn.textContent;btn.textContent=label||'처리 중…';}
  else if(btn._l){btn.textContent=btn._l;}
}

/* ---------- 알림 ---------- */
function notify(uid,text,kind,pref){
  var u=USERS[uid];
  if(pref&&u&&u.notif&&u.notif[pref]===false) return Promise.resolve();
  return FB.addDoc(FB.collection(db,'notifications'),
    {user:uid,text:text,kind:kind,at:Date.now(),read:false}).catch(function(e){console.warn(e)});
}
function unread(){return NOTIS.filter(function(n){return !n.read}).length;}

/* ---------- 확인창 ---------- */
var pendingYes=null;
function askConfirm(msg,onYes){
  pendingYes=onYes;
  document.getElementById('modalBox').innerHTML='<p>'+esc(msg)+'</p>'+
    '<div class="acts"><button class="btn ghost" style="flex:1" onclick="closeModal()">취소</button>'+
    '<button class="btn" style="flex:1" onclick="confirmYes()">확인</button></div>';
  document.getElementById('modalOv').classList.add('on');
}
function confirmYes(){var f=pendingYes; closeModal(); if(f) f();}
function closeModal(){document.getElementById('modalOv').classList.remove('on'); pendingYes=null;}

/* ---------- 렌더 ---------- */
function render(keep){
  var box=document.getElementById('app');
  var chatEl=keep?document.getElementById('chat_in'):null;
  var chatVal=chatEl?chatEl.value:null;
  var f=SCREENS[view.name]||SCREENS.login;
  box.innerHTML=f(view.arg);
  if(chatVal){var el=document.getElementById('chat_in'); if(el) el.value=chatVal;}
  var cb=document.getElementById('chatbox'); if(cb) cb.scrollTop=cb.scrollHeight;
}
function refresh(){
  if(!ME) return;
  if(view.name==='splash'){view={name:'home',arg:'explore'};render();return;}
  if(LIVE[view.name]) render(true);
}
function nav(active){
  var n=unread();
  var items=[['home','홈'],['create','개설'],['chats','채팅'],
             ['alerts','알림'+(n?'<span class="badge">'+n+'</span>':'')],['settings','설정']];
  return '<nav class="nav">'+items.map(function(i){
    return '<button class="'+(active===i[0]?'on':'')+'" onclick="go(\''+i[0]+'\')">'+i[1]+'</button>';
  }).join('')+'</nav>';
}
function head(title,back,arg){
  var on=back?'go(\''+back+'\''+(arg?',\''+arg+'\'':'')+')':'';
  return '<div class="top">'+(back?'<button class="back" onclick="'+on+'">←</button>':'')+
    '<span class="title">'+esc(title)+'</span></div>';
}
function emptyBox(ic,h,p,btn,act){
  return '<div class="empty"><div class="ic">'+ic+'</div><div class="h">'+esc(h)+'</div>'+
    '<p>'+p+'</p>'+(btn?'<button class="btn sm" style="margin-top:14px" onclick="'+act+'">'+esc(btn)+'</button>':'')+'</div>';
}

var SCREENS={};

SCREENS.splash=function(){
  return '<section class="screen"><div class="splash"><div class="spin"></div>'+
    '<p class="sub">스터디 정보를 불러오는 중</p></div></section>';
};
SCREENS.fatal=function(msg){
  return '<section class="screen"><div class="splash">'+
    '<div class="h" style="font-size:15px;font-weight:600">서버에 연결하지 못했어요</div>'+
    '<p style="text-align:center">'+esc(msg||'인터넷 연결을 확인한 뒤 새로고침해 주세요.')+'</p>'+
    '<button class="btn" style="margin-top:8px" onclick="location.reload()">다시 시도</button></div></section>';
};

SCREENS.broken=function(){
  return '<section class="screen"><div class="splash">'+
    '<div class="h" style="font-size:15px;font-weight:600">프로필 정보를 찾을 수 없어요</div>'+
    '<p style="text-align:center">로그인 계정은 있지만 프로필이 없습니다.<br>로그아웃한 뒤 다시 가입해 주세요.</p>'+
    '<button class="btn" style="margin-top:8px" onclick="doLogout()">로그아웃</button></div></section>';
};

/* ---------- 연결 ---------- */
function boot(){
  FB=window.FB; auth=FB.auth; db=FB.db;
  FB.onAuthStateChanged(auth,function(u){
    if(signingUp) return;
    unsubAll();
    if(!u){clearState(); view={name:'login'}; render(); return;}
    if(window.REQUIRE_VERIFIED&&!u.emailVerified){
      FB.signOut(auth);
      toast('이메일 인증을 먼저 완료해 주세요.\n메일함에서 인증 링크를 눌러주세요.');
      return;
    }
    UID=u.uid; view={name:'splash'}; render(); subscribe(u.uid);
  });
}
window.addEventListener('fb-ready',boot);
window.addEventListener('fb-fail',function(){view={name:'fatal',arg:'Firebase 설정을 불러오지 못했습니다.'};render();});
setTimeout(function(){
  if(!FB){view={name:'fatal',arg:'Firebase SDK를 불러오지 못했습니다. 네트워크나 차단 프로그램을 확인해 주세요.'};render();}
},10000);

function clearState(){
  ME=MEPUB=MEPRIV=UID=null; gotPub=false;
  USERS={};STUDIES=[];APPS_MINE=[];APPS_HOST=[];NOTIS=[];MSGS={};
}
function unsubAll(){
  subs.forEach(function(f){try{f()}catch(e){}}); subs=[];
  Object.keys(msgSubs).forEach(function(k){try{msgSubs[k]()}catch(e){}}); msgSubs={};
}
function docs(qs){var a=[];qs.forEach(function(d){var o=d.data();o.id=d.id;a.push(o)});return a;}

function subscribe(uid){
  var c=FB;
  subs.push(c.onSnapshot(c.doc(db,'users',uid),function(s){
    MEPUB=s.exists()?s.data():null; gotPub=true; mergeMe();
  },fail));
  subs.push(c.onSnapshot(c.doc(db,'users',uid,'private','info'),function(s){
    MEPRIV=s.exists()?s.data():null; mergeMe();
  },fail));
  subs.push(c.onSnapshot(c.collection(db,'users'),function(qs){
    USERS={}; docs(qs).forEach(function(u){USERS[u.id]=u});
    loaded.users=true; refresh();
  },fail));
  subs.push(c.onSnapshot(c.collection(db,'studies'),function(qs){
    STUDIES=docs(qs); loaded.studies=true; syncMsgSubs(); refresh();
  },fail));
  subs.push(c.onSnapshot(c.query(c.collection(db,'applications'),c.where('user','==',uid)),
    function(qs){APPS_MINE=docs(qs); refresh();},fail));
  subs.push(c.onSnapshot(c.query(c.collection(db,'applications'),c.where('host','==',uid)),
    function(qs){APPS_HOST=docs(qs); refresh();},fail));
  subs.push(c.onSnapshot(c.query(c.collection(db,'notifications'),c.where('user','==',uid)),
    function(qs){NOTIS=docs(qs).sort(function(a,b){return b.at-a.at}); refresh();},fail));
}
function mergeMe(){
  if(!UID) return;
  if(!MEPUB){
    ME=null;
    if(gotPub&&!signingUp){view={name:'broken'};render();}
    return;
  }
  ME={id:UID,nick:MEPUB.nick,grade:MEPUB.grade,notif:MEPUB.notif||{},
      email:(auth.currentUser||{}).email||'',
      verified:!!(auth.currentUser||{}).emailVerified};
  if(MEPRIV){ME.cls=MEPRIV.cls;ME.num=MEPRIV.num;ME.phone=MEPRIV.phone;
             ME.goal=MEPRIV.goal;ME.marketing=!!MEPRIV.marketing;}
  syncMsgSubs(); refresh();
}
function syncMsgSubs(){
  if(!ME) return;
  var want={};
  STUDIES.forEach(function(s){if((s.members||[]).indexOf(ME.id)>=0) want[s.id]=1;});
  Object.keys(msgSubs).forEach(function(id){
    if(!want[id]){try{msgSubs[id]()}catch(e){} delete msgSubs[id]; delete MSGS[id];}
  });
  Object.keys(want).forEach(function(id){
    if(msgSubs[id]) return;
    msgSubs[id]=FB.onSnapshot(
      FB.query(FB.collection(db,'studies',id,'messages'),FB.orderBy('at','desc'),FB.limit(200)),
      function(qs){
        MSGS[id]=docs(qs).sort(function(a,b){return a.at-b.at});
        refresh();
      },function(e){console.warn(e)});
  });
}

function doSignup(){
  var id=document.getElementById('su_id').value.trim();
  var pw=document.getElementById('su_pw').value;
  var pw2=document.getElementById('su_pw2').value;
  var n=document.getElementById('su_nick').value.trim();
  var grade=parseInt(document.getElementById('su_grade').value,10);
  var cls=parseInt(document.getElementById('su_cls').value,10);
  var num=parseInt(document.getElementById('su_num').value,10);
  var phone=document.getElementById('su_phone').value.trim();
  var goal=document.getElementById('su_goal').value;
  var btn=document.getElementById('suBtn');
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(id)){setErr('su_err','이메일 형식을 확인해 주세요.');return;}
  if(!domainOk(id)){setErr('su_err',window.ALLOWED_DOMAIN+' 도메인 이메일만 가입할 수 있어요.');return;}
  if(pw.length<6){setErr('su_err','비밀번호를 6자 이상 입력해 주세요.');return;}
  if(pw!==pw2){setErr('su_err','비밀번호가 서로 달라요.');return;}
  if(n.length<2){setErr('su_err','닉네임을 2글자 이상 입력해 주세요.');return;}
  if(!cls||cls<1||cls>20){setErr('su_err','반을 올바르게 입력해 주세요.');return;}
  if(!num||num<1||num>40){setErr('su_err','번호를 올바르게 입력해 주세요.');return;}
  if(!/^01[016789]-?\d{3,4}-?\d{4}$/.test(phone)){setErr('su_err','전화번호 형식을 확인해 주세요.');return;}

  var mk=!!draft.marketing;
  signingUp=true; busy(btn,true,'가입 중…');
  var uid=null;
  FB.createUserWithEmailAndPassword(auth,id,pw).then(function(cred){
    uid=cred.user.uid;
    return FB.setDoc(FB.doc(db,'users',uid),{
      nick:n, grade:grade,
      notif:{result:true,change:true,close:true,remind:true,apply:true,chat:true,night:true}
    });
  }).then(function(){
    return FB.setDoc(FB.doc(db,'users',uid,'private','info'),{
      email:id, cls:cls, num:num, phone:phone, goal:goal, marketing:mk, createdAt:Date.now()
    });
  }).then(function(){
    FB.sendEmailVerification(auth.currentUser).catch(function(){});
    return notify(uid,'슼터디에 오신 걸 환영해요. 관심 있는 스터디에 지원해 보세요.','안내');
  }).then(function(){
    signingUp=false; draft={}; UID=uid;
    view={name:'splash'}; render(); subscribe(uid);
    toast('가입이 완료되었어요.\n인증 메일을 보냈으니 메일함을 확인해 주세요.');
  }).catch(function(e){
    signingUp=false; busy(btn,false); setErr('su_err',errMsg(e));
    if(auth.currentUser){
      FB.deleteUser(auth.currentUser).catch(function(){FB.signOut(auth)});
    }
  });
}

SCREENS.home=function(tab){

    '<div class="scroll">'+body+'</div>'+nav('home')+'</section>';

var filt={mode:'',region:'',days:[],goal:'',sort:'room'};
function passFilter(s){
  if(s.closed) return false;
  if(filt.mode&&s.mode!==filt.mode) return false;
  if(filt.region&&String(s.region||'').indexOf(filt.region)<0) return false;
  if(filt.days.length&&filt.days.indexOf(s.day)<0) return false;
  return true;
}
function exploreList(){
  var list=STUDIES.filter(passFilter);
  list.sort(function(a,b){
    if(filt.sort==='room') return (b.cap-b.members.length)-(a.cap-a.members.length);
    if(filt.sort==='deadline') return new Date(a.deadline)-new Date(b.deadline);
    return 0;
  });
  var h='<div class="card tap" style="display:flex;gap:8px;align-items:center;color:var(--faint);font-size:13px" onclick="go(\'filter\')">'+
    '<span>⌕</span><span>'+(filtLabel()||'지역, 요일, 목표로 검색')+'</span></div>';
  if(!list.length){
    h+= (STUDIES.length||filtLabel())
      ? emptyBox('⌕','조건에 맞는 스터디가 없어요',
          '지역을 넓히거나 요일 조건을 풀어보세요.<br>직접 열면 비슷한 친구들이 찾아올 거예요.',
          '필터 초기화','resetFilt()')
      : emptyBox('◌','아직 열린 스터디가 없어요',
          '첫 스터디를 열어보세요.<br>같은 학교 친구들에게 바로 보입니다.',
          '스터디 개설하기','go(\'create\')');
    return h;
  }
  h+=list.map(studyCard).join('');
  h+='<button class="btn ghost" style="margin-top:6px" onclick="go(\'create\')">스터디 개설하기</button>';
  return h;
}
function filtLabel(){
  var p=[];
  if(filt.mode)p.push(filt.mode);
  if(filt.region)p.push(filt.region);
  if(filt.days.length)p.push(filt.days.join('·')+'요일');
  return p.join(' · ');
}
function resetFilt(){filt={mode:'',region:'',days:[],goal:'',sort:'room'};go('home','explore');}
function studyCard(s){
  var left=s.cap-s.members.length, d=dleft(s.deadline);
  return '<div class="card tap" onclick="go(\'detail\',\''+s.id+'\')">'+
    '<div class="row"><span class="name">'+esc(s.title)+'</span><span class="pill tag">'+esc(s.mode)+'</span></div>'+
    '<div class="meta">'+esc(s.region)+' · '+esc(s.day)+'요일 '+esc(s.time)+'<br>'+
    s.members.length+'/'+s.cap+'명 · '+(d>0?('마감까지 '+d+'일'):'모집 마감')+
    (left<=0?' · 대기 신청 가능':'')+'</div></div>';
}
function mineList(){
  var joined=STUDIES.filter(function(s){return (s.members||[]).indexOf(ME.id)>=0&&s.host!==ME.id});
  var hosted=STUDIES.filter(function(s){return s.host===ME.id});
  var pend=APPS_MINE.filter(function(a){return a.status!=='approved'});
  var h='';
  if(!joined.length&&!hosted.length&&!pend.length)
    return emptyBox('◌','참여 중인 스터디가 없어요',
      '마음에 드는 스터디에 지원해 보세요.<br>승인되면 여기에 모임 일정이 표시됩니다.',
      '스터디 둘러보기','go(\'home\',\'explore\')');
  if(joined.length){
    h+=joined.map(function(s){
      return '<div class="card tap" onclick="go(\'chat\',\''+s.id+'\')">'+
        '<div class="row"><span class="name">'+esc(s.title)+'</span><span class="pill ok">참여중</span></div>'+
        '<div class="meta">'+esc(s.day)+'요일 '+esc(s.time)+' · '+esc(s.region)+'<br>'+esc(s.place)+'</div></div>';
    }).join('');
  }
  if(pend.length){
    h+=pend.map(function(a){
      var s=study(a.study); if(!s) return '';
      var st=a.status==='pending'?['wait','승인 대기']:['no','거절됨'];
      return '<div class="card"><div class="row"><span class="name">'+esc(s.title)+'</span>'+
        '<span class="pill '+st[0]+'">'+st[1]+'</span></div>'+
        '<div class="meta">'+ago(a.at)+' 지원'+
        (a.status==='pending'?'<br>모임 장소는 승인 후 공개됩니다':'')+'</div>'+
        (a.status==='pending'?'<button class="btn ghost" style="margin-top:10px" onclick="cancelApp(\''+a.id+'\')">지원 취소</button>':'')+
        '</div>';
    }).join('');
  }
  if(hosted.length){
    h+='<hr><h2 style="font-size:14px">내가 연 스터디</h2>';
    h+=hosted.map(function(s){
      var p=appsFor(s.id).filter(function(a){return a.status==='pending'}).length;
      return '<div class="card tap" onclick="go(\'manage\',\''+s.id+'\')">'+
        '<div class="row"><span class="name">'+esc(s.title)+'</span>'+
        (p?'<span class="pill wait">지원 '+p+'건</span>':'<span class="pill tag">'+s.members.length+'/'+s.cap+'명</span>')+'</div>'+
        '<div class="meta">'+(s.closed?'모집 마감됨':'모집 중')+' · '+esc(s.day)+'요일 '+esc(s.time)+'</div></div>';
    }).join('');
  }
  return h;
}
function cancelApp(id){
  askConfirm('지원을 취소할까요?',function(){
    var a=APPS_MINE.filter(function(x){return x.id===id})[0];
    FB.deleteDoc(FB.doc(db,'applications',id)).then(function(){
      if(a){var s=study(a.study); if(s) notify(s.host,ME.nick+'님이 '+s.title+' 지원을 취소했어요.','지원','apply');}
      toast('지원을 취소했어요.'); go('home','mine');
    }).catch(fail);
  });
}

function defaultDeadline(){
  var d=new Date(Date.now()+14*86400000);
  return d.toISOString().slice(0,10);
}
function doCreate(){
  var t=document.getElementById('c_title').value.trim();
  var r=document.getElementById('c_region').value.trim();
  var btn=document.getElementById('cBtn');
  if(t.length<2){setErr('c_err','스터디 이름을 입력해 주세요.');return;}
  if(!r){setErr('c_err','지역을 입력해 주세요.');return;}
  var gs=[];
  document.querySelectorAll('#c_grades .chip.on').forEach(function(c){gs.push(parseInt(c.dataset.g,10))});
  if(!gs.length){setErr('c_err','지원 가능한 학년을 하나 이상 선택해 주세요.');return;}
  var qs=[document.getElementById('c_q1').value.trim(),document.getElementById('c_q2').value.trim()]
    .filter(function(q){return q});
  var s={host:ME.id,title:t,mode:document.getElementById('c_mode').value,
    place:document.getElementById('c_place').value,region:r,
    day:document.getElementById('c_day').value,time:document.getElementById('c_time').value,
    cap:parseInt(document.getElementById('c_cap').value,10),
    deadline:document.getElementById('c_dl').value,
    desc:document.getElementById('c_desc').value.trim()||'소개가 아직 없어요.',
    grades:gs,level:document.getElementById('c_level').value,qs:qs,
    members:[ME.id],closed:false,createdAt:Date.now()};
  busy(btn,true,'여는 중…');
  FB.addDoc(FB.collection(db,'studies'),s).then(function(ref){
    toast('스터디를 열었어요.'); go('manage',ref.id);
  }).catch(function(e){busy(btn,false);setErr('c_err',errMsg(e));});
}

function doApply(id){
  var s=study(id), u=me(), btn=document.getElementById('apBtn');
  var intro=document.getElementById('ap_intro').value.trim();
  if(intro.length<10){setErr('ap_err','자기소개를 10글자 이상 적어주세요.');return;}
  if(/01[016-9][-\s]?\d{3,4}[-\s]?\d{4}|@[a-zA-Z0-9_.]+/.test(intro)){
    setErr('ap_err','연락처나 SNS 아이디는 지원서에 적을 수 없어요.');return;}
  var ans=s.qs.map(function(q,i){return document.getElementById('ap_q'+i).value.trim()});
  busy(btn,true,'제출 중…');
  FB.addDoc(FB.collection(db,'applications'),{
    study:s.id,host:s.host,user:u.id,intro:intro,answers:ans,
    level:document.getElementById('ap_lv').value,status:'pending',at:Date.now()
  }).then(function(){
    return notify(s.host,u.nick+'님이 '+s.title+'에 지원했어요.','새 지원','apply');
  }).then(function(){
    toast('지원이 제출되었어요.\n방장이 확인하면 알림으로 알려드릴게요.');
    go('home','mine');
  }).catch(function(e){busy(btn,false);setErr('ap_err',errMsg(e));});
}

SCREENS.manage=function(id){
  if(!ME) return SCREENS.splash();
  var s=study(id);
  if(!s||s.host!==ME.id) return SCREENS.home();
  var all=appsFor(s.id);
  var pend=all.filter(function(a){return a.status==='pending'});
  var done=all.filter(function(a){return a.status!=='pending'});
  var left=s.cap-s.members.length;
  var h='<section class="screen">'+head('지원자 관리','home','mine')+'<div class="scroll">'+
    '<div class="row" style="margin-bottom:12px"><span style="font-size:14.5px;font-weight:600">'+esc(s.title)+'</span>'+
    '<span class="pill tag">'+s.members.length+' / '+s.cap+'명</span></div>'+
    '<div style="display:flex;gap:7px;margin-bottom:14px">'+
    '<button class="btn ghost" style="flex:1" onclick="go(\'editstudy\',\''+s.id+'\')">정보 수정</button>'+
    '<button class="btn ghost" style="flex:1" onclick="go(\'chat\',\''+s.id+'\')">채팅 열기</button></div>';
  if(!pend.length&&!done.length){
    h+=emptyBox('◌','아직 지원자가 없어요','스터디가 목록에 노출되고 있어요.<br>조금만 기다려 주세요.','');
  } else {
    h+=pend.sort(function(a,b){return a.at-b.at}).map(function(a){return appCard(a,s,true)}).join('');
    if(done.length){h+='<hr><h2 style="font-size:14px">처리한 지원</h2>'+done.map(function(a){return appCard(a,s,false)}).join('');}
  }
  h+='<div class="note">정원이 차도 지원은 계속 받을 수 있어요. 자리가 생기면 대기 중인 지원자를 바로 승인할 수 있습니다.'+
    (left<=0?'<br>지금은 자리가 없어 승인 시 정원 초과 안내가 나옵니다.':'')+'</div>';
  return h+'</div></section>';
};
function appCard(a,s,act){
  var u=user(a.user);
  var st=a.status==='approved'?'<span class="pill ok">승인됨</span>':
         a.status==='rejected'?'<span class="pill no">거절됨</span>':'<span class="sub">'+ago(a.at)+'</span>';
  var h='<div class="card"><div class="row"><span class="name">'+esc(u.nick)+'</span>'+st+'</div>'+
    '<div class="chips" style="margin-top:7px;margin-bottom:0">'+
    '<span class="pill tag">고'+esc(u.grade)+'</span><span class="pill tag">'+esc(a.level)+'</span></div>'+
    '<p style="font-size:12.5px;margin-top:9px">'+esc(a.intro)+'</p>';
  s.qs.forEach(function(q,i){
    h+='<div style="font-size:12px;margin-top:9px"><span class="sub">'+esc(q)+'</span><br>'+esc((a.answers||[])[i]||'(답변 없음)')+'</div>';
  });
  if(act) h+='<div style="display:flex;gap:7px;margin-top:11px">'+
    '<button class="btn sm" style="flex:1" onclick="decide(\''+a.id+'\',\'approved\')">승인</button>'+
    '<button class="btn sm danger" style="flex:1" onclick="decide(\''+a.id+'\',\'rejected\')">거절</button></div>';
  return h+'</div>';
}
function decide(aid,st){
  var a=APPS_HOST.filter(function(x){return x.id===aid})[0]; if(!a) return;
  var s=study(a.study); if(!s) return;
  if(st==='approved'){
    if(s.members.length>=s.cap){
      askConfirm('정원이 이미 찼어요. 그래도 승인할까요?\n승인하면 정원이 1명 늘어납니다.',function(){
        approveApp(a,s,s.cap+1);
      });
      return;
    }
    approveApp(a,s,s.cap);
  } else {
    FB.updateDoc(FB.doc(db,'applications',a.id),{status:'rejected'}).then(function(){
      return notify(a.user,s.title+' 지원이 아쉽게도 거절되었어요. 다른 스터디도 둘러보세요.','지원 결과','result');
    }).then(function(){toast('지원을 거절했어요.');}).catch(fail);
  }
}
function approveApp(a,s,cap){
  var nick=user(a.user).nick;
  FB.updateDoc(FB.doc(db,'studies',s.id),{members:FB.arrayUnion(a.user),cap:cap})
    .then(function(){return FB.updateDoc(FB.doc(db,'applications',a.id),{status:'approved'});})
    .then(function(){
      return FB.addDoc(FB.collection(db,'studies',s.id,'messages'),
        {user:'sys',text:nick+'님이 스터디에 합류했어요.',at:Date.now()});
    })
    .then(function(){
      return notify(a.user,s.title+' 지원이 승인되었어요. 모임 장소를 확인해 주세요.','매칭 확정','result');
    })
    .then(function(){toast(nick+'님을 승인했어요.\n장소와 일정이 공개되었습니다.');})
    .catch(fail);
}

function saveStudy(id){
  var s=study(id), btn=document.getElementById('eBtn');
  var cap=parseInt(document.getElementById('e_cap').value,10);
  if(cap<s.members.length){setErr('e_err','참여 중인 '+s.members.length+'명보다 적게 줄일 수 없어요.');return;}
  var chg=[];
  var nd=document.getElementById('e_day').value, nt=document.getElementById('e_time').value;
  var np=document.getElementById('e_place').value, nr=document.getElementById('e_region').value.trim();
  var nt2=document.getElementById('e_title').value.trim()||s.title;
  if(nd!==s.day||nt!==s.time) chg.push('모임 시간이 '+nd+'요일 '+nt+'로 바뀌었어요');
  if(np!==s.place||nr!==s.region) chg.push('모임 장소가 '+np+' · '+nr+'로 바뀌었어요');
  if(cap!==s.cap) chg.push('정원이 '+cap+'명으로 바뀌었어요');
  busy(btn,true,'저장 중…');
  FB.updateDoc(FB.doc(db,'studies',id),{
    title:nt2,place:np,region:nr,day:nd,time:nt,cap:cap,
    deadline:document.getElementById('e_dl').value,
    desc:document.getElementById('e_desc').value.trim()||s.desc
  }).then(function(){
    if(!chg.length) return null;
    var ps=s.members.filter(function(m){return m!==ME.id})
      .map(function(m){return notify(m,'['+nt2+'] '+chg.join(', ')+'.','스터디 변경','change')});
    ps.push(FB.addDoc(FB.collection(db,'studies',id,'messages'),

function closeStudy(id){
  var s=study(id), now=!s.closed;
  FB.updateDoc(FB.doc(db,'studies',id),{closed:now}).then(function(){
    if(now){
      appsFor(id).filter(function(a){return a.status==='pending'}).forEach(function(a){
        notify(a.user,'['+s.title+'] 모집이 마감되었어요. 지원 결과를 기다려 주세요.','모집 마감','change');
      });
      toast('모집을 마감했어요. 참여 중인 멤버는 그대로 유지됩니다.');
    } else toast('모집을 다시 열었어요.');
  }).catch(fail);

function delStudy(id){
  var s=study(id);
  var mem=s.members.filter(function(m){return m!==ME.id});
  var apps=appsFor(id).filter(function(a){return a.status==='pending'});
  askConfirm('스터디를 삭제할까요?\n참여 중인 멤버 '+mem.length+'명과 지원자 '+apps.length+'명에게 삭제 알림이 갑니다.',function(){
    var ps=mem.map(function(m){return notify(m,'['+s.title+'] 방장이 스터디를 닫았어요. 더 이상 모임이 열리지 않습니다.','스터디 삭제','close')});
    apps.forEach(function(a){ps.push(notify(a.user,'['+s.title+'] 스터디가 삭제되어 지원이 취소되었어요.','스터디 삭제','close'))});
    Promise.all(ps)
      .then(function(){return FB.getDocs(FB.collection(db,'studies',id,'messages'));})
      .then(function(qs){
        var b=FB.writeBatch(db);
        qs.forEach(function(d){b.delete(d.ref)});
        appsFor(id).forEach(function(a){b.delete(FB.doc(db,'applications',a.id))});
        b.delete(FB.doc(db,'studies',id));
        return b.commit();
      })
      .then(function(){
        toast('스터디를 삭제했어요.\n멤버 '+mem.length+'명과 지원자 '+apps.length+'명에게 안내를 보냈습니다.');

      }).catch(fail);

}

function saveProfile(){
  var n=document.getElementById('p_nick').value.trim();
  var grade=parseInt(document.getElementById('p_grade').value,10);
  var cls=parseInt(document.getElementById('p_cls').value,10);
  var num=parseInt(document.getElementById('p_num').value,10);
  var phone=document.getElementById('p_phone').value.trim();
  var goal=document.getElementById('p_goal').value;
  var pw=document.getElementById('p_pw').value;
  var btn=document.getElementById('pBtn');
  if(n.length<2){setErr('p_err','닉네임을 2글자 이상 입력해 주세요.');return;}
  if(!cls||cls<1||cls>20){setErr('p_err','반을 올바르게 입력해 주세요.');return;}
  if(!num||num<1||num>40){setErr('p_err','번호를 올바르게 입력해 주세요.');return;}
  if(!/^01[016789]-?\d{3,4}-?\d{4}$/.test(phone)){setErr('p_err','전화번호 형식을 확인해 주세요.');return;}
  if(pw&&pw.length<6){setErr('p_err','새 비밀번호를 6자 이상 입력해 주세요.');return;}
  busy(btn,true,'저장 중…');
  FB.updateDoc(FB.doc(db,'users',ME.id),{nick:n,grade:grade})
    .then(function(){
      return FB.updateDoc(FB.doc(db,'users',ME.id,'private','info'),
        {cls:cls,num:num,phone:phone,goal:goal});
    })
    .then(function(){ return pw?FB.updatePassword(auth.currentUser,pw):null; })
    .then(function(){
      toast(pw?'저장했어요. 비밀번호도 바뀌었어요.':'저장했어요.'); go('settings');
    })
    .catch(function(e){busy(btn,false);setErr('p_err',errMsg(e));});
}

    '<button class="btn danger" id="lvb" disabled onclick="doLeave()">탈퇴하기</button></section>';

function doLeave(){
  var uid=ME.id, btn=document.getElementById('lvb');
  var hosted=STUDIES.filter(function(s){return s.host===uid});
  var joined=STUDIES.filter(function(s){return s.host!==uid&&(s.members||[]).indexOf(uid)>=0});
  busy(btn,true,'처리 중…');

  var ps=[];
  hosted.forEach(function(s){
    s.members.forEach(function(m){
      if(m!==uid) ps.push(notify(m,'['+s.title+'] 방장이 탈퇴하여 스터디가 닫혔어요.','스터디 삭제','close'));
    });
  });
  Promise.all(ps)
    .then(function(){
      return Promise.all(hosted.map(function(s){
        return FB.getDocs(FB.collection(db,'studies',s.id,'messages')).then(function(qs){
          var b=FB.writeBatch(db);
          qs.forEach(function(d){b.delete(d.ref)});
          appsFor(s.id).forEach(function(a){b.delete(FB.doc(db,'applications',a.id))});
          b.delete(FB.doc(db,'studies',s.id));
          return b.commit();
        });
      }));
    })
    .then(function(){
      return Promise.all(joined.map(function(s){
        return FB.updateDoc(FB.doc(db,'studies',s.id),{members:FB.arrayRemove(uid)});
      }));
    })
    .then(function(){
      var b=FB.writeBatch(db);
      APPS_MINE.forEach(function(a){b.delete(FB.doc(db,'applications',a.id))});
      NOTIS.forEach(function(n){b.delete(FB.doc(db,'notifications',n.id))});
      b.delete(FB.doc(db,'users',uid,'private','info'));
      b.delete(FB.doc(db,'users',uid));
      return b.commit();
    })
    .then(function(){
      unsubAll();
      return FB.deleteUser(auth.currentUser);
    })
    .then(function(){toast('탈퇴가 완료되었어요.');})
    .catch(function(e){busy(btn,false);setErr('lv_err',errMsg(e));});
}
