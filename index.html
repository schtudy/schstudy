<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슼터디 - 경북일고 스터디 매칭 플랫폼</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-20">

  <!-- 상단 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-md mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="nav('home')">
        <span class="bg-indigo-600 text-white font-bold text-lg px-2 py-0.5 rounded-lg">슼</span>
        <h1 class="font-bold text-lg text-slate-900">슼터디</h1>
      </div>
      <div class="flex items-center space-x-3" id="header-right">
        <!-- JS 동적 렌더링 -->
      </div>
    </div>
  </header>

  <!-- 메인 컨테이너 -->
  <main class="max-w-md mx-auto p-4" id="app">
    <!-- JS 동적 렌더링 -->
  </main>

  <!-- 하단 네비게이션 -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-30 max-w-md mx-auto">
    <div class="flex justify-around items-center h-16">
      <button onclick="nav('home')" class="flex flex-col items-center text-slate-600 hover:text-indigo-600">
        <i class="fas fa-home text-lg"></i>
        <span class="text-xs mt-1">홈</span>
      </button>
      <button onclick="nav('create')" class="flex flex-col items-center text-slate-600 hover:text-indigo-600">
        <i class="fas fa-plus-circle text-lg"></i>
        <span class="text-xs mt-1">개설</span>
      </button>
      <button onclick="nav('my')" class="flex flex-col items-center text-slate-600 hover:text-indigo-600">
        <i class="fas fa-user-friends text-lg"></i>
        <span class="text-xs mt-1">내 스터디</span>
      </button>
      <button onclick="nav('noti')" class="relative flex flex-col items-center text-slate-600 hover:text-indigo-600">
        <i class="fas fa-bell text-lg"></i>
        <span class="text-xs mt-1">알림</span>
        <span id="noti-badge" class="hidden absolute top-1 right-3 w-2 h-2 bg-red-500 rounded-full"></span>
      </button>
    </div>
  </nav>

  <!-- Firebase SDK 및 실시간 스크립트 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, doc, setDoc, addDoc, onSnapshot, query, orderBy, serverTimestamp, deleteDoc 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDl5ia0YyOq4IzY52FFv934WTXVrWAqjCU",
      authDomain: "schstudy-eabd8.firebaseapp.com",
      projectId: "schstudy-eabd8",
      storageBucket: "schstudy-eabd8.firebasestorage.app",
      messagingSenderId: "785902705483",
      appId: "1:785902705483:web:411a40b8a8122ad616a6ce",
      measurementId: "G-CCYVW0NDMS"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // 전역 상태
    window.S = {
      me: JSON.parse(localStorage.getItem('sch_me')) || null,
      users: [],
      studies: [],
      apps: [],
      msgs: [],
      notis: [],
      view: 'home',
      detailId: null,
      filter: 'all',
      search: '',
      chatId: null
    };

    // 실시간 수신기 설정
    function initRealtime() {
      // 1. 유저 실시간
      onSnapshot(collection(db, "users"), (snap) => {
        S.users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });

      // 2. 스터디 실시간
      onSnapshot(collection(db, "studies"), (snap) => {
        S.studies = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });

      // 3. 지원서 실시간
      onSnapshot(collection(db, "applications"), (snap) => {
        S.apps = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });

      // 4. 메시지 실시간 (시간순 정렬)
      const qMsgs = query(collection(db, "messages"), orderBy("timestamp", "asc"));
      onSnapshot(qMsgs, (snap) => {
        S.msgs = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });

      // 5. 알림 실시간
      onSnapshot(collection(db, "notifications"), (snap) => {
        S.notis = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      });
    }

    // 전역 DB 조작 메서드
    window.dbAPI = {
      async loginOrRegister(name, grade, classNum) {
        const userObj = { name, grade: parseInt(grade), classNum: parseInt(classNum) };
        const userRef = doc(db, "users", `${grade}-${classNum}-${name}`);
        await setDoc(userRef, userObj, { merge: true });
        S.me = { id: userRef.id, ...userObj };
        localStorage.setItem('sch_me', JSON.stringify(S.me));
        render();
      },

      async createStudy(studyData) {
        await addDoc(collection(db, "studies"), {
          ...studyData,
          hostId: S.me.id,
          createdAt: serverTimestamp()
        });
        nav('home');
      },

      async applyStudy(studyId, reason) {
        await addDoc(collection(db, "applications"), {
          studyId,
          applicantId: S.me.id,
          reason,
          status: 'pending',
          createdAt: serverTimestamp()
        });
        alert('지원이 완료되었습니다!');
        nav('home');
      },

      async updateAppStatus(appId, status) {
        await setDoc(doc(db, "applications", appId), { status }, { merge: true });
      },

      async sendMessage(studyId, text) {
        await addDoc(collection(db, "messages"), {
          studyId,
          senderId: S.me.id,
          senderName: S.me.name,
          text,
          timestamp: serverTimestamp(),
          timeStr: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        });
      }
    };

    window.nav = function(view, id = null) {
      S.view = view;
      if (id) {
        if (view === 'detail') S.detailId = id;
        if (view === 'chat') S.chatId = id;
      }
      render();
    };

    window.render = function() {
      const appDiv = document.getElementById('app');
      const headerRight = document.getElementById('header-right');

      // 상단 프로필 헤더
      if (S.me) {
        headerRight.innerHTML = `
          <span class="text-xs bg-indigo-50 text-indigo-600 px-2 py-1 rounded-md font-semibold">
            ${S.me.grade}학년 ${S.me.classNum}반 ${S.me.name}
          </span>
          <button onclick="localStorage.removeItem('sch_me'); S.me=null; render();" class="text-xs text-slate-400 underline">로그아웃</button>
        `;
      } else {
        headerRight.innerHTML = `<button onclick="nav('login')" class="text-xs bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-medium">로그인</button>`;
      }

      // 비로그인 시 로그인 화면 강제
      if (!S.me && S.view !== 'login') {
        S.view = 'login';
      }

      // 뷰 분기
      if (S.view === 'login') renderLogin(appDiv);
      else if (S.view === 'home') renderHome(appDiv);
      else if (S.view === 'create') renderCreate(appDiv);
      else if (S.view === 'detail') renderDetail(appDiv);
      else if (S.view === 'my') renderMy(appDiv);
      else if (S.view === 'chat') renderChat(appDiv);
      else if (S.view === 'noti') renderNoti(appDiv);
    };

    // 뷰 렌더링 함수들
    function renderLogin(el) {
      el.innerHTML = `
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 text-center mt-10">
          <h2 class="text-xl font-bold mb-2">슼터디 시작하기</h2>
          <p class="text-xs text-slate-500 mb-6">경북일고 학생 정보를 입력해주세요.</p>
          <form onsubmit="event.preventDefault(); dbAPI.loginOrRegister(this.name.value, this.grade.value, this.classNum.value);" class="space-y-4">
            <input type="text" name="name" placeholder="이름 (예: 김현우)" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <div class="grid grid-cols-2 gap-2">
              <input type="number" name="grade" min="1" max="3" placeholder="학년 (예: 2)" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
              <input type="number" name="classNum" min="1" max="15" placeholder="반 (예: 3)" required class="w-full px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl hover:bg-indigo-700 transition">접속하기</button>
          </form>
        </div>
      `;
    }

    function renderHome(el) {
      const filtered = S.studies.filter(st => {
        const matchesSearch = st.title.includes(S.search) || st.desc.includes(S.search);
        const matchesFilter = S.filter === 'all' || st.subject === S.filter;
        return matchesSearch && matchesFilter;
      });

      el.innerHTML = `
        <div class="mb-4 space-y-3">
          <input type="text" placeholder="스터디 검색..." value="${S.search}" oninput="S.search=this.value; render();" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
          <div class="flex space-x-2 overflow-x-auto hide-scrollbar text-xs">
            ${['all', '국어', '수학', '영어', '탐구', '자율'].map(subj => `
              <button onclick="S.filter='${subj}'; render();" class="px-3 py-1.5 rounded-full whitespace-nowrap ${S.filter === subj ? 'bg-indigo-600 text-white font-semibold' : 'bg-white border border-slate-200 text-slate-600'}">
                ${subj === 'all' ? '전체' : subj}
              </button>
            `).join('')}
          </div>
        </div>

        <div class="space-y-3">
          ${filtered.length === 0 ? `<p class="text-center py-10 text-xs text-slate-400">등록된 스터디가 없습니다.</p>` : ''}
          ${filtered.map(st => `
            <div onclick="nav('detail', '${st.id}')" class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm hover:border-indigo-200 cursor-pointer transition">
              <div class="flex justify-between items-start mb-2">
                <span class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2 py-0.5 rounded-md">${st.subject}</span>
                <span class="text-xs text-slate-400">${st.members ? st.members.length : 1} / ${st.maxMembers}명</span>
              </div>
              <h3 class="font-bold text-slate-900 mb-1">${st.title}</h3>
              <p class="text-xs text-slate-500 line-clamp-2 mb-3">${st.desc}</p>
              <div class="text-xs text-slate-400 border-t border-slate-50 pt-2 flex justify-between">
                <span>방장: ${st.hostId}</span>
                <span>${st.targetGrade}학년 대상</span>
              </div>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderCreate(el) {
      el.innerHTML = `
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
          <h2 class="font-bold text-lg mb-4">새 스터디 개설</h2>
          <form onsubmit="event.preventDefault(); dbAPI.createStudy({
            title: this.title.value,
            subject: this.subject.value,
            targetGrade: this.targetGrade.value,
            maxMembers: parseInt(this.maxMembers.value),
            desc: this.desc.value,
            members: [S.me.id]
          });" class="space-y-4 text-sm">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">스터디 제목</label>
              <input type="text" name="title" required placeholder="예: 물리학 I 단권화 스터디" class="w-full px-3 py-2 rounded-xl border border-slate-200">
            </div>
            <div class="grid grid-cols-2 gap-2">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">과목</label>
                <select name="subject" class="w-full px-3 py-2 rounded-xl border border-slate-200">
                  <option value="국어">국어</option>
                  <option value="수학">수학</option>
                  <option value="영어">영어</option>
                  <option value="탐구">탐구</option>
                  <option value="자율">자율</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1">모집 인원</label>
                <input type="number" name="maxMembers" min="2" max="10" value="4" class="w-full px-3 py-2 rounded-xl border border-slate-200">
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">대상 학년</label>
              <select name="targetGrade" class="w-full px-3 py-2 rounded-xl border border-slate-200">
                <option value="전학년">전학년</option>
                <option value="1">1학년</option>
                <option value="2">2학년</option>
                <option value="3">3학년</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">스터디 설명</label>
              <textarea name="desc" rows="4" required placeholder="목표와 진행 방식을 적어주세요." class="w-full px-3 py-2 rounded-xl border border-slate-200"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">개설 완료</button>
          </form>
        </div>
      `;
    }

    function renderDetail(el) {
      const st = S.studies.find(s => s.id === S.detailId);
      if (!st) { el.innerHTML = `<p class="p-4">스터디를 찾을 수 없습니다.</p>`; return; }

      const isHost = st.hostId === S.me.id;
      const isMember = st.members && st.members.includes(S.me.id);
      const myApp = S.apps.find(a => a.studyId === st.id && a.applicantId === S.me.id);

      el.innerHTML = `
        <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm space-y-4">
          <div class="flex justify-between items-center">
            <span class="text-xs bg-indigo-50 text-indigo-600 font-semibold px-2 py-0.5 rounded-md">${st.subject}</span>
            <button onclick="nav('home')" class="text-xs text-slate-400"><i class="fas fa-times text-base"></i></button>
          </div>
          <h2 class="text-xl font-bold text-slate-900">${st.title}</h2>
          <p class="text-sm text-slate-600 whitespace-pre-line leading-relaxed">${st.desc}</p>

          <div class="bg-slate-50 p-3 rounded-xl space-y-1 text-xs text-slate-500">
            <div>• 방장: ${st.hostId}</div>
            <div>• 인원: ${st.members ? st.members.length : 1} / ${st.maxMembers}명</div>
            <div>• 대상: ${st.targetGrade}학년</div>
          </div>

          ${isMember ? `
            <button onclick="nav('chat', '${st.id}')" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl flex items-center justify-center space-x-2">
              <i class="fas fa-comments"></i>
              <span>실시간 스터디 채팅방 입실</span>
            </button>
          ` : myApp ? `
            <div class="w-full bg-slate-100 text-slate-500 font-bold py-3 rounded-xl text-center text-sm">
              지원 상태: ${myApp.status === 'pending' ? '승인 대기 중 ⏳' : myApp.status === 'approved' ? '승인됨 🎉' : '거절됨 ❌'}
            </div>
          ` : `
            <form onsubmit="event.preventDefault(); dbAPI.applyStudy('${st.id}', this.reason.value);" class="space-y-3 pt-2">
              <input type="text" name="reason" required placeholder="방장에게 전달할 가입 신청 한마디" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm">
              <button type="submit" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl">스터디 지원하기</button>
            </form>
          `}
        </div>
      `;
    }

    function renderChat(el) {
      const st = S.studies.find(s => s.id === S.chatId);
      const msgs = S.msgs.filter(m => m.studyId === S.chatId);

      el.innerHTML = `
        <div class="flex flex-col h-[80vh] bg-white rounded-2xl border border-slate-100 overflow-hidden">
          <div class="p-4 bg-slate-50 border-b border-slate-100 flex justify-between items-center">
            <h3 class="font-bold text-sm truncate">${st ? st.title : '채팅방'}</h3>
            <button onclick="nav('detail', '${S.chatId}')" class="text-xs text-slate-400">나가기</button>
          </div>
          <div class="flex-1 p-4 overflow-y-auto space-y-3 hide-scrollbar" id="chat-box">
            ${msgs.map(m => {
              const isMe = m.senderId === S.me.id;
              return `
                <div class="flex flex-col ${isMe ? 'items-end' : 'items-start'}">
                  <span class="text-[10px] text-slate-400 mb-0.5">${m.senderName}</span>
                  <div class="max-w-[75%] px-3 py-2 rounded-2xl text-xs ${isMe ? 'bg-indigo-600 text-white rounded-br-none' : 'bg-slate-100 text-slate-800 rounded-bl-none'}">
                    ${m.text}
                  </div>
                  <span class="text-[9px] text-slate-300 mt-0.5">${m.timeStr || ''}</span>
                </div>
              `;
            }).join('')}
          </div>
          <form onsubmit="event.preventDefault(); const t=this.msg.value; if(t){ dbAPI.sendMessage('${S.chatId}', t); this.msg.value=''; }" class="p-2 border-t border-slate-100 flex space-x-2">
            <input type="text" name="msg" placeholder="메시지 입력..." autocomplete="off" class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-1 focus:ring-indigo-500">
            <button type="submit" class="bg-indigo-600 text-white px-4 rounded-xl text-xs font-bold">전송</button>
          </form>
        </div>
      `;

      setTimeout(() => {
        const box = document.getElementById('chat-box');
        if (box) box.scrollTop = box.scrollHeight;
      }, 50);
    }

    function renderMy(el) {
      const myStudies = S.studies.filter(st => st.members && st.members.includes(S.me.id));
      const hostedApps = S.apps.filter(a => {
        const st = S.studies.find(s => s.id === a.studyId);
        return st && st.hostId === S.me.id && a.status === 'pending';
      });

      el.innerHTML = `
        <div class="space-y-5">
          ${hostedApps.length > 0 ? `
            <div class="bg-amber-50 p-4 rounded-2xl border border-amber-200">
              <h3 class="font-bold text-xs text-amber-800 mb-2">승인 대기 중인 지원서 (${hostedApps.length})</h3>
              <div class="space-y-2">
                ${hostedApps.map(a => `
                  <div class="bg-white p-3 rounded-xl text-xs flex justify-between items-center">
                    <div>
                      <span class="font-bold">${a.applicantId}</span>
                      <p class="text-slate-500">${a.reason}</p>
                    </div>
                    <div class="flex space-x-1">
                      <button onclick="dbAPI.updateAppStatus('${a.id}', 'approved')" class="bg-indigo-600 text-white px-2.5 py-1 rounded-lg">승인</button>
                      <button onclick="dbAPI.updateAppStatus('${a.id}', 'rejected')" class="bg-slate-200 text-slate-600 px-2.5 py-1 rounded-lg">거절</button>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
          ` : ''}

          <div>
            <h3 class="font-bold text-sm text-slate-900 mb-3">참여 중인 스터디</h3>
            <div class="space-y-3">
              ${myStudies.length === 0 ? `<p class="text-xs text-slate-400 py-4">참여 중인 스터디가 없습니다.</p>` : ''}
              ${myStudies.map(st => `
                <div onclick="nav('chat', '${st.id}')" class="bg-white p-4 rounded-2xl border border-slate-100 flex justify-between items-center cursor-pointer">
                  <div>
                    <h4 class="font-bold text-sm">${st.title}</h4>
                    <span class="text-xs text-indigo-600 font-medium">채팅방 입장하기 →</span>
                  </div>
                  <i class="fas fa-chevron-right text-slate-300"></i>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderNoti(el) {
      el.innerHTML = `
        <div class="bg-white p-4 rounded-2xl border border-slate-100">
          <h3 class="font-bold text-sm mb-3">실시간 알림</h3>
          <p class="text-xs text-slate-400 text-center py-6">새로운 알림이 없습니다.</p>
        </div>
      `;
    }

    // 앱 개시
    initRealtime();
  </script>
</body>
</html>
